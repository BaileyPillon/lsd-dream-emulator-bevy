[workspace]
members = ["crates/lsd-core", "crates/lsd-assets", "crates/lsd-bevy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/BaileyPillon/lsd-dream-emulator-bevy"

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
lsd-core = { path = "crates/lsd-core" }
lsd-assets = { path = "crates/lsd-assets" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
