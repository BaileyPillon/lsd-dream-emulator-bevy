name: Original behavior or port feature
description: Propose original-behavior recovery, development tooling, or an optional modification.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: track
    attributes:
      label: Workstream
      options:
        - Original game behavior and parity
        - Development or AI-assisted analysis tooling
        - Optional gameplay modification
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Original behavior and expected result
      description: Describe the concrete trigger and expected behavior, or the development problem the tool would solve.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reference evidence, inputs and scope
      description: Link observations or function/format anchors without uploading game assets.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Describe original/port comparison, deterministic inputs and known exclusions.
    validations:
      required: true
