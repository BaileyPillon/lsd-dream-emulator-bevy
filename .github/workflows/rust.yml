name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt
      - name: Check documentation links and public evidence
        run: |
          python tools/check_docs.py
          python -m unittest discover -s tools/tests -v
      - name: Install pinned documentation tools
        run: python -m pip install -r tools/requirements-docs.txt
      - name: Build and validate the handbook
        run: |
          python -m mkdocs build --strict
          python tools/check_site.py .private/site

  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux audio build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clean --doc
          cargo doc --workspace --lib --no-deps --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: runner.os == 'Linux'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt
      - name: Validate combined handbook and API reference
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r tools/requirements-docs.txt
          python -m mkdocs build --strict
          python tools/stage_api.py target/doc .private/site --revision "${{ github.sha }}"
          python tools/check_site.py .private/site --require-api
      - run: cargo test --workspace --locked
      - run: cargo test -p lsd-bevy --features audio --locked
      - run: cargo run -p lsd-bevy --locked -- --steps 120 --seed 1
      - name: Check desktop preview
        if: runner.os == 'Windows'
        run: cargo check -p lsd-bevy --features desktop --locked
